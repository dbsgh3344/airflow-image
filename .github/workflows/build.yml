name: build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # 내장 GITHUB_TOKEN으로 GHCR에 push한다. PAT나 클라우드 자격증명이 필요 없다.

env:
  IMAGE: ghcr.io/${{ github.repository }}
  AIRFLOW_VERSION: "3.2.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=${AIRFLOW_VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GKE 노드가 amd64다. 플랫폼을 지정하지 않으면 러너 아키텍처를 따라가 배포 때 터진다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "pushed ${IMAGE}:${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
